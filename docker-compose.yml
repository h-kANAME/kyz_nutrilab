# Local development — all services dockerized
# Usage: cp .env.example .env && docker compose up --build
# App: http://127.0.0.1:8088

services:
  nutrilabcaddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      - nutrilabweb
      - nutrilabapi
    networks: [nutrilab]

  nutrilabweb:
    build:
      context: ./apps/web
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    expose:
      - "80"
    networks: [nutrilab]

  nutrilabapi:
    build:
      context: ./apps/api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NODE_ENV: development
      API_PORT: "8080"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS:-*}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_NAME: ${COOKIE_NAME:-nutrilab_session}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SQLITE_PATH: /data/nutrilab.db
      UPLOAD_DIR: /data/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@kyz-apps.site}
    volumes:
      - nutrilab_sqlite:/data
    networks: [nutrilab]
    security_opt:
      - no-new-privileges:true

volumes:
  nutrilab_sqlite:

networks:
  nutrilab:
    driver: bridge
